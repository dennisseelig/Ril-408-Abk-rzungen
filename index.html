<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nachschlagewerk für Bahn-Begriffe und Abkürzungen">
  <title>Bahn-Begriffe & Abkürzungen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Bahn Abkürzungen und Begriffe</h1>

      <div class="search-wrap">
        <input
          id="search"
          type="search"
          autocomplete="off"
          placeholder="z. B. Tf, Fdl, Stellwerk …"
          autofocus
          aria-label="Bahn-Begriff suchen"
        >
        <button id="clear" aria-label="Suche löschen">×</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="toolbar">
        <div id="count" aria-live="polite"></div>
      </div>

      <section class="results" id="results" aria-live="polite"></section>
    </div>
  </main>

  <footer>
    <span id="data-info"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
